name: Nightly listing update

# runs about 3am eastern
# secrets: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, RELETME_SUPABASE_URL, RELETME_ANON_KEY

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency: listing-update

jobs:
  update-listings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r dataPipeline/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s dataPipeline/tests -t .

      - name: Update listings
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RELETME_SUPABASE_URL: ${{ secrets.RELETME_SUPABASE_URL }}
          RELETME_ANON_KEY: ${{ secrets.RELETME_ANON_KEY }}
        run: python -m dataPipeline.scheduled
