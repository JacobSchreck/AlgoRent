name: CI

# Runs on every pull request and on pushes to the long-lived branches.
# Branch strategy: live (production) <- dev-BE / dev-FE <- feature branches.
on:
  pull_request:
  push:
    branches: [main, live, dev-BE, dev-FE]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Includes the Testcontainers tests, which start Postgres 17 in Docker (available on GitHub runners).
      - name: Build and test
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
