services:
  postgres:
    image: postgres:17
    container_name: algorent-postgres

    environment:
      POSTGRES_DB: algorent
      POSTGRES_USER: algorent
      POSTGRES_PASSWORD: algorent

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algorent -d algorent"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
