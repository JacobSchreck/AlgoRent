spring:
  application:
    name: algorent-backend

  # Same variable names as dataPipeline/.env, with defaults that match docker-compose.yml.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:algorent}
    username: ${DB_USER:algorent}
    password: ${DB_PASSWORD:algorent}

  flyway:
    # Migrations in src/main/resources/db/migration own the schema.
    # If a database was created earlier by running database/schema.sql by hand,
    # Flyway marks it as V1 and applies only the newer migrations.
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

algorent:
  cors:
    # Comma-separated list. The Next.js dev server runs on :3000.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
